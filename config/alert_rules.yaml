alerts:
  - name: High user-facing latency
    severity: warning
    condition: latency_p95_ms > 3000 for 5m
    type: symptom-based
    owner: observability-oncall
    runbook: docs/alerts.md#alert-1
  - name: Elevated request error rate
    severity: critical
    condition: error_rate_pct > 2 for 5m
    type: symptom-based
    owner: api-oncall
    runbook: docs/alerts.md#alert-2
  - name: Quality score degradation
    severity: warning
    condition: quality_score_avg < 0.75 for 15m
    type: symptom-based
    owner: ai-quality-oncall
    runbook: docs/alerts.md#alert-3
